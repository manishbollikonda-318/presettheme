services:
  - type: web
    name: loc-qr-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install --production=false && npm run build
    startCommand: node dist/index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_POOL_MAX
        value: 10
      - key: JWT_PRIVATE_KEY_B64
        sync: false
      - key: JWT_PUBLIC_KEY_B64
        sync: false
      - key: JWT_ACCESS_TTL
        value: 2h
      - key: JWT_REFRESH_TTL
        value: 7d
      - key: JWT_GUEST_TTL
        value: 4h
      - key: QR_ENCRYPTION_KEY
        value: 3c24fca61efd54a33042d05a3a632fb6103d409213924af028d9a0e528f4e012
      - key: QR_TOKEN_TTL_HOURS
        value: 24
      - key: RATE_LIMIT_LOGIN
        value: 10
      - key: RATE_LIMIT_QR_VERIFY
        value: 30
      - key: RATE_LIMIT_ORDER_CREATE
        value: 15
